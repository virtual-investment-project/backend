version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: investment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: investment_db
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:alpine
    container_name: investment-redis
    ports:
      - "6379:6379"