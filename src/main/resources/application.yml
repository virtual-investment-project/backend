spring:
  application:
    name: investment-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/investment_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email

jwt:
  secret: ${JWT_SECRET:VlwEyVlpkZ9Ws5vQy7XgrkfVq8gVjnmT9F3eLz6Kx1A=}
  access-expiration: 3600000  # 1시간 (밀리초)
  refresh-expiration: 1209600000 # 14일

# Firebase Admin SDK 설정 (FCM 푸시 알림)
# src/main/resources/firebase-service-account.json 에 서비스 계정 JSON 파일 위치
firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:virtual-investment-firebase-adminsdk-fbsvc-eb76c719b1.json}
